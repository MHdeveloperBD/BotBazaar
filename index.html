mine(){const L=S.bots.filter(b=>S.owned[b.id]);return `<h2 style="margin-top:4px">আমার কেনা Bot</h2>${L.map(b=>`<div class="card row"><div><b>${esc(b.name)}</b><p>${S.owned[b.id]} · ${b.price} Coin</p></div><button class="btn sm" data-go="bot" data-arg="${b.id}">Open Bot</button></div>`).join("")||'<div class="card"><p>এখনও কোনো Bot কেনেননি। স্টোর থেকে বেছে নিন।</p></div>'}`},
ads(){const c=S.cfg,pr=Math.min(100,c.adToday/c.adLimit*100);
return `<h2 style="margin-top:4px">বিজ্ঞাপন দেখে আয়</h2><div class="hero" style="padding:16px"><small>বর্তমান ব্যালান্স</small><div class="n" style="font-size:34px">${S.coin} Coin</div></div>
<div class="card" style="margin-top:12px"><div class="row"><div><b>প্রতি বিজ্ঞাপনে ${c.adReward} Coin</b><p>আজ ${c.adToday} / ${c.adLimit}</p></div>${ic("h_ads")}</div><div class="bar" style="background:var(--s2)"><i style="width:${pr}%"></i></div></div>
${!c.adOn?'<p>বিজ্ঞাপন সার্ভিস এখন বন্ধ আছে।</p>':c.adToday>=c.adLimit?'<p>Daily Ad Limit Reached। কাল আবার আসুন।</p>':'<button class="btn gold" data-a="ad">Watch Ad</button>'}`},
bal(){const t=S.st;return `<h2 style="margin-top:4px">ব্যালান্স</h2><div class="hero" style="padding:16px"><small>বর্তমান ব্যালান্স</small><div class="n" style="font-size:38px">${S.coin} Coin</div></div>
<div class="g2" style="margin:12px 0">${[["মোট আয়",t.earned],["মোট Withdraw",t.withdraw],["মোট Deposit",t.deposit],["Referral আয়",t.refEarn],["বিজ্ঞাপন আয়",t.adEarn],["কেনায় খরচ",t.spent]].map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join("")}</div>
<div class="g2"><button class="btn" data-go="dep">Deposit</button><button class="btn" data-go="wd">Withdraw</button><button class="btn ghost" data-go="hist">History</button><button class="btn ghost" data-go="lv">Level</button></div>`},
dep(){const c=S.cfg,m=c.depMethods.filter(x=>x.on),a=m[S.dm||0]||m[0];
return `<button class="back" data-go="bal">‹ Balance</button><h2 style="margin-top:0">Deposit</h2>
<div class="chips">${m.map((x,i)=>`<button class="${x===a?"on":""}" data-dm="${i}">${esc(x.n)}</button>`).join("")}</div>
${a?`<div class="card"><p>${esc(a.n)} নম্বর/অ্যাড্রেস</p><b style="font-size:18px;word-break:break-all">${esc(a.a)}</b><p style="margin-top:6px">${c.depCoin} Coin = ${c.depBdt} BDT</p></div>
<input id="da" type="number" inputmode="decimal" placeholder="টাকার পরিমাণ (BDT)"><p id="dc" style="margin:-4px 0 10px"></p><input id="dt" placeholder="Transaction ID"><button class="btn" data-a="dep">Submit Deposit</button>`:'<p>এখন কোনো Deposit মেথড চালু নেই।</p>'}`},
wd(){const c=S.cfg;if(!c.wdOn)return `<button class="back" data-go="bal">‹ Balance</button><div class="card"><b>Withdraw Service Currently Unavailable</b><p>Admin এটি সাময়িক বন্ধ রেখেছেন।</p></div>`;
return `<button class="back" data-go="bal">‹ Balance</button><h2 style="margin-top:0">Withdraw</h2><div class="card"><p>রেট: <b style="color:var(--coin)">${c.wdCoin} Coin = ${c.wdBdt} BDT</b> · সর্বনিম্ন ${c.wdMin} Coin</p></div>
<select id="wm">${c.wdMethods.map(m=>`<option>${esc(m)}</option>`).join("")}</select><input id="wa" type="number" inputmode="numeric" placeholder="Coin-এর পরিমাণ"><p id="wc" style="margin:-4px 0 10px"></p><input id="wr" placeholder="Payment নম্বর / Address"><button class="btn" data-a="wd">Review &amp; Withdraw</button>`},
hist(){return `<button class="back" data-go="bal">‹ Balance</button><h2 style="margin-top:0">লেনদেনের হিসাব</h2>${S.hist.map(h=>`<div class="card row"><div><b>${esc(h.t)}</b><p>${h.d} · ${h.ref} · ${esc(h.st)}</p></div><span class="${h.a>=0?"plus":"minus"}">${h.a>=0?"+":""}${h.a}</span></div>`).join("")||'<div class="card"><p>এখনও কোনো লেনদেন নেই।</p></div>'}`},
lv(){const l=lvl();return `<button class="back" data-go="bal">‹ Balance</button><h2 style="margin-top:0">Level</h2>${S.levels.map(x=>`<div class="card row"><div class="row" style="justify-content:flex-start">${ic("lv_"+x.n)}<div><b>Level ${x.n} · ${esc(x.name)}</b><p>প্রয়োজন: ${x.need} Coin আয় · Reward: ${x.reward} Coin</p></div></div>${S.st.earned>=x.need?'<span class="tag ok">অর্জিত</span>':'<span class="tag">বাকি</span>'}</div>`).join("")}`},
board(){if(!S.cfg.lbOn)return '<div class="card"><p>Leaderboard এখন বন্ধ আছে।</p></div>';const t=S.bt||"all",L=S.board[t]||[];
return `<h2 style="margin-top:4px">Leaderboard</h2><div class="chips">${[["daily","Daily"],["weekly","Weekly"],["all","All Time"]].map(x=>`<button class="${t===x[0]?"on":""}" data-bt="${x[0]}">${x[1]}</button>`).join("")}</div>${L.map((u,i)=>`<div class="card row"><div class="row" style="justify-content:flex-start"><span class="rk ${i<3?"t":""}">${i+1}</span><div><b>${esc(u.n)}</b><p>@${esc(u.u)} · Level ${u.lv}</p></div></div><span class="price">${u.s}</span></div>`).join("")||'<div class="card"><p>এখনও কোনো তথ্য নেই।</p></div>'}`},
ref(){const k="https://t.me/"+CFG.BOT+"?start=ref"+S.user.id;return `<h2 style="margin-top:4px">Refer & Earn</h2>${!S.cfg.refOn?'<p>Referral এখন বন্ধ আছে।</p>':`<div class="hero" style="padding:16px"><small>প্রতি সফল Referral-এ</small><div class="n" style="font-size:36px">${S.cfg.refReward} Coin</div></div>
<div class="g2" style="margin:12px 0"><div class="stat"><b>${S.refCount}</b><span>মোট Referral</span></div><div class="stat"><b>${S.st.refEarn}</b><span>Referral আয়</span></div></div>
<input id="rl" readonly value="${esc(k)}"><div class="g2"><button class="btn" data-a="copy">Copy Link</button><button class="btn ghost" data-a="share">Share</button></div>`}`},
me(){const l=lvl(),t=S.st;return `<h2 style="margin-top:4px">অ্যাকাউন্ট</h2><div class="card">${[["নাম",S.user.name],["Username",S.user.username?"@"+S.user.username:"-"],["Telegram ID",S.user.id||"-"],["ব্যালান্স",S.coin+" Coin"],["Level",l.n+" · "+l.name],["মোট আয়",t.earned],["মোট Withdraw",t.withdraw],["মোট Deposit",t.deposit],["Referral",S.refCount],["যোগদান",S.user.joined]].map(x=>`<div class="row" style="padding:7px 0;border-bottom:1px solid var(--s2)"><span class="mute">${x[0]}</span><b>${esc(x[1])}</b></div>`).join("")}</div>
<div class="g2"><button class="btn ghost" data-go="mine">My Purchases</button><button class="btn ghost" data-go="lv">Level</button><button class="btn ghost" data-go="hist">History</button><button class="btn ghost" data-go="board">Leaderboard</button></div>
<button class="btn" style="margin-top:10px" data-go="help">Help &amp; Support</button>${S.admin||demo?'<button class="btn ghost" style="margin-top:10px" data-go="adm">Admin: Icon ও ছবি সেট করুন</button>':""}`},
news(){return `<button class="back" data-go="home">‹ Home</button><h2 style="margin-top:0">খবর</h2>${S.news.map(n=>`<div class="card"><b>${esc(n.t)}</b><p>${esc(n.d)}</p><p style="font-size:12px;margin-top:4px">${esc(n.date)}</p></div>`).join("")}`},
adm(){const K=[["h_store","Bot Store"],["h_buy","My Purchases"],["h_ads","Watch Ads"],["h_bal","Balance"],["h_ref","Refer & Earn"],["h_acc","Account"],["h_news","News"],["h_help","Help"],["n_home","Menu: Home"],["n_store","Menu: Store"],["n_ads","Menu: Ads"],["n_bal","Menu: Balance"],["n_me","Menu: Account"]].concat(S.btns.map(b=>["sb_"+b.k,"Store: "+b.name]),S.levels.map(l=>["lv_"+l.n,"Level "+l.n]));
return `<button class="back" data-go="me">‹ Account</button><h2 style="margin-top:0">Admin: Icon ও ছবি</h2><p style="margin-bottom:12px">প্রতিটি জায়গায় Emoji লিখুন অথবা ছবির লিংক দিন। ফাঁকা রাখলে ডিফল্ট আইকন থাকবে।</p>
<div class="card"><b>Home Banner</b><p style="margin:4px 0 8px">ছবির লিংক</p><div class="arow"><input data-k="banner" value="${esc(S.banner||"")}" placeholder="https://..."><label class="up">Upload<input type="file" accept="image/*" data-up="banner"></label></div></div>
<div class="card">${K.map(k=>`<div class="arow">${ic(k[0])}<input data-k="${k[0]}" value="${esc(S.icons[k[0]]||"")}" placeholder="${esc(k[1])}"><label class="up">Upload<input type="file" accept="image/*" data-up="${k[0]}"></label></div>`).join("")}</div>
<button class="btn" data-a="admsave">Save করুন</button>`},
help(){return `<button class="back" data-go="me">‹ Account</button><h2 style="margin-top:0">সাহায্য</h2>${S.faq.map(f=>`<details><summary>${esc(f[0])}</summary><p>${esc(f[1])}</p></details>`).join("")}
<h2>Promo Code</h2><div class="card"><input id="pc" placeholder="কোড লিখুন"><button class="btn" data-a="promo">Apply Code</button></div>
<h2>Support</h2><div class="card"><textarea id="tm" rows="3" placeholder="আপনার সমস্যা লিখুন"></textarea><button class="btn" data-a="tk">Send Ticket</button></div>`}};
const NAV=[["home","Home","n_home"],["store","Store","n_store"],["ads","Ads","n_ads"],["bal","Balance","n_bal"],["me","Account","n_me"]],MAIN={home:"home",news:"home",store:"store",bot:"store",mine:"store",ads:"ads",bal:"bal",dep:"bal",wd:"bal",hist:"bal",lv:"bal",me:"me",help:"me",adm:"me",board:"me",ref:"home"};
let cur="home";
function go(p,a){cur=p;if(S.cfg.maintenance&&!S.admin){$("view").innerHTML='<div class="card" style="margin-top:40px"><b>Service temporarily unavailable.</b><p>কিছুক্ষণ পর আবার চেষ্টা করুন।</p></div>';return}
$("view").innerHTML=P[p](a);$("bbnav").innerHTML=NAV.map(n=>`<button class="${MAIN[p]===n[0]?"on":""}" data-go="${n[0]}">${ic(n[2])}${n[1]}</button>`).join("");$("bb").scrollTop=0}
const re=()=>go(cur,S.arg);
document.addEventListener("click",async e=>{const t=e.target.closest("[data-go],[data-a],[data-f],[data-dm],[data-bt]");if(!t||!$("bb").contains(t))return;const d=t.dataset;
if(d.go){S.arg=d.arg;return go(d.go,d.arg)}
if(d.f){S.f=d.f;return re()}if(d.dm){S.dm=+d.dm;return re()}if(d.bt){S.bt=d.bt;return re()}
const c=S.cfg;
if(d.a==="buy"){const b=S.bots.find(x=>x.id==d.id);if(S.coin<b.price)return toast("Coin কম আছে। বিজ্ঞাপন দেখুন বা Deposit করুন");const r=await api("buy",{id:b.id});
 if(demo){S.coin-=b.price;S.st.spent+=b.price;S.owned[b.id]=new Date().toLocaleDateString("bn-BD");log("Purchase: "+b.name,-b.price)}else if(r&&r.ok)Object.assign(S,r.state);else return toast((r&&r.error)||"কেনা হয়নি");toast("Bot Purchased Successfully");re()}
if(d.a==="dl"||d.a==="tut"){await api(d.a==="dl"?"download":"tutorial",{id:+d.id});toast(demo?"ডেমো: ফাইল বটের চ্যাটে যাবে":"বটের চ্যাটে পাঠানো হয়েছে")}
if(d.a==="ad"){t.disabled=true;try{const f=window[CFG.AD];if(typeof f==="function")await f();else if(!demo){toast("Monetag SDK যুক্ত নেই");return re()}else await new Promise(r=>setTimeout(r,1200));
 const r=await api("ad",{});if(demo){c.adToday++;S.coin+=c.adReward;S.st.earned+=c.adReward;S.st.adEarn+=c.adReward;log("বিজ্ঞাপন আয়",c.adReward)}else if(r&&r.ok)Object.assign(S,r.state);toast("+"+c.adReward+" Coin")}catch(x){toast("বিজ্ঞাপন সম্পূর্ণ হয়নি")}re()}
if(d.a==="dep"){const a=+$("da").value,x=$("dt").value.trim();if(!(a>0)||!x)return toast("পরিমাণ ও Transaction ID দিন");const m=c.depMethods.filter(z=>z.on)[S.dm||0];const r=await api("deposit",{amount:a,method:m.n,tx:x});log("Deposit ("+m.n+")",Math.floor(a/c.depBdt*c.depCoin),"Pending");toast("Deposit Request Submitted · Pending");go("hist")}
if(d.a==="wd"){const a=+$("wa").value,r=$("wr").value.trim();if(!(a>0)||!r)return toast("পরিমাণ ও অ্যাড্রেস দিন");if(a<c.wdMin)return toast("সর্বনিম্ন "+c.wdMin+" Coin");if(a>S.coin)return toast("Coin যথেষ্ট নেই");
 const ok=confirm("Withdrawal যাচাই করুন"+NL+a+" Coin = "+cv(a,{coin:c.wdCoin,bdt:c.wdBdt})+" BDT"+NL+$("wm").value+": "+r);if(!ok)return;const q=await api("withdraw",{amount:a,method:$("wm").value,account:r});
 if(demo){S.coin-=a;log("Withdraw",-a,"Pending")}else if(q&&q.ok)Object.assign(S,q.state);else return toast((q&&q.error)||"অনুরোধ হয়নি");toast("Withdraw Request Submitted");go("hist")}
if(d.a==="promo"){const k=$("pc").value.trim();if(!k)return toast("কোড লিখুন");const r=await api("promo",{code:k});if(demo)toast("ডেমো: কোড সার্ভারে যাচাই হবে");else if(r&&r.ok){Object.assign(S,r.state);toast("Bonus Coin যোগ হয়েছে");re()}else toast((r&&r.error)||"কোডটি সঠিক নয়")}
if(d.a==="tk"){const m=$("tm").value.trim();if(!m)return toast("সমস্যা লিখুন");await api("ticket",{message:m});$("tm").value="";toast("Support Ticket তৈরি হয়েছে")}
if(d.a==="admsave"){document.querySelectorAll("[data-k]").forEach(i=>{const k=i.dataset.k,v=i.value.trim();if(k==="banner")S.banner=v;else if(v)S.icons[k]=v;else delete S.icons[k]});await api("admin_icons",{icons:S.icons,banner:S.banner});toast(demo?"ডেমো: সার্ভার যুক্ত হলে সেভ হবে":"Save হয়েছে");re()}
if(d.a==="copy"){try{await navigator.clipboard.writeText($("rl").value);toast("লিংক কপি হয়েছে")}catch(x){$("rl").select();toast("কপি করুন")}}
if(d.a==="share"){const u="https://t.me/share/url?url="+encodeURIComponent($("rl").value)+"&text="+encodeURIComponent("Bot Bazaar-এ বিজ্ঞাপন দেখে Coin আয় করুন, Bot নিন!");tg?tg.openTelegramLink(u):open(u)}});
document.addEventListener("input",e=>{const c=S.cfg;if(e.target.id==="da"){const v=+e.target.value||0;$("dc").textContent="আপনি পাবেন: "+Math.floor(v/c.depBdt*c.depCoin)+" Coin"}
if(e.target.id==="wa"){const v=+e.target.value||0;$("wc").textContent="আপনি পাবেন: "+cv(v,{coin:c.wdCoin,bdt:c.wdBdt})+" BDT"}});
document.addEventListener("change",async e=>{const f=e.target.files&&e.target.files[0];if(!f||!e.target.dataset.up)return;if(demo)return toast("ছবি আপলোডের জন্য ব্যাকএন্ড লাগবে। এখন লিংক বসান");const fd=new FormData();fd.append("file",f);fd.append("initData",tg?tg.initData:"");try{const r=await(await fetch(CFG.API+"?action=admin_upload",{method:"POST",body:fd})).json();if(r.ok){document.querySelector('[data-k="'+e.target.dataset.up+'"]').value=r.url;toast("আপলোড হয়েছে, Save চাপুন")}else toast(r.error||"আপলোড হয়নি")}catch(x){toast("আপলোড হয়নি")}});
(async()=>{const u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;if(u)S.user={id:u.id,name:[u.first_name,u.last_name].filter(Boolean).join(" "),username:u.username||"",joined:"আজ"};
const r=await api("init",{start:tg&&tg.initDataUnsafe?tg.initDataUnsafe.start_param:""});if(r&&r.ok)Object.assign(S,r.state);go("home")})();
})();

</script>
